name: Fedora RPM

# Builds the RPM on every push and pull request, so a broken build shows up
# straight away. Pushing a tag such as v3.0 also publishes the packages on the
# GitHub release page.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Fedora ${{ matrix.fedora }}
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        # The Fedora releases still supported; an RPM built on one release
        # may not install on an older one
        fedora: ['43', '44']
    steps:
      # git has to be there before checkout, otherwise checkout downloads a
      # plain copy without history and "git archive" cannot run
      - name: Install build tools
        run: dnf -y install git rpm-build rpmdevtools gcc-c++ make qt6-qtbase-devel desktop-file-utils

      - uses: actions/checkout@v4

      - name: Build the RPM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=$(rpmspec -q --srpm --qf '%{version}' qstit.spec)
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VERSION" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match Version $VERSION in qstit.spec"
            exit 1
          fi
          TOP="$GITHUB_WORKSPACE/rpmbuild"
          mkdir -p "$TOP/SOURCES"
          git archive --prefix="qstit-$VERSION/" -o "$TOP/SOURCES/qstit-$VERSION.tar.gz" HEAD
          rpmbuild -ba --define "_topdir $TOP" qstit.spec

      - uses: actions/upload-artifact@v4
        with:
          name: qstit-fedora-${{ matrix.fedora }}
          path: |
            rpmbuild/RPMS/*/*.rpm
            rpmbuild/SRPMS/*.rpm
            !rpmbuild/RPMS/*/*-debug*.rpm
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: rpms
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: rpms/**/*.rpm
