name: Fedora RPM

# Builds the RPM on every push and pull request, so a broken build shows up
# straight away.
#
# A push to master also publishes a GitHub release when qstit.spec carries a
# Version-Release that has no tag yet: Release 1 is tagged v<Version> (v3.1),
# a later Release v<Version>-<Release> (v3.1-2). So to release, bump Version
# or Release in the spec and merge; any other merge only builds. Pushing a v*
# tag by hand still publishes that tag too.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Fedora ${{ matrix.fedora }}
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        # The Fedora releases still supported; an RPM built on one release
        # may not install on an older one
        fedora: ['43', '44']
    steps:
      # git has to be there before checkout, otherwise checkout downloads a
      # plain copy without history and "git archive" cannot run
      - name: Install build tools
        run: dnf -y install git rpm-build rpmdevtools gcc-c++ make qt6-qtbase-devel desktop-file-utils libappstream-glib

      - uses: actions/checkout@v4

      - name: Build the RPM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION=$(rpmspec -q --srpm --qf '%{version}' qstit.spec)
          RELEASE=$(rpmspec -q --srpm --undefine dist --qf '%{release}' qstit.spec)
          # v3.0 for the first package of a version, v3.0-2 for a packaging-only update
          TAG="${GITHUB_REF#refs/tags/v}"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$TAG" != "$VERSION" && "$TAG" != "$VERSION-$RELEASE" ]]; then
            echo "::error::Tag v$TAG does not match $VERSION or $VERSION-$RELEASE in qstit.spec"
            exit 1
          fi
          TOP="$GITHUB_WORKSPACE/rpmbuild"
          mkdir -p "$TOP/SOURCES"
          git archive --prefix="qstit-$VERSION/" -o "$TOP/SOURCES/qstit-$VERSION.tar.gz" HEAD
          rpmbuild -ba --define "_topdir $TOP" qstit.spec

      # Installing checks that the package's dependencies resolve; starting it
      # catches a crash, an error message or a memory bug at start-up, which
      # the build and the compiler cannot see. The debuginfo packages give the
      # valgrind reports their source lines.
      - name: Install the RPM and start Qstit
        run: |
          dnf -y install gdb valgrind rpmbuild/RPMS/x86_64/*.rpm
          .github/smoke-test.sh /usr/bin/qstit

      - uses: actions/upload-artifact@v4
        with:
          name: qstit-fedora-${{ matrix.fedora }}
          path: |
            rpmbuild/RPMS/*/*.rpm
            rpmbuild/SRPMS/*.rpm
            !rpmbuild/RPMS/*/*-debug*.rpm
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Decide the release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(awk '$1 == "Version:" {print $2; exit}' qstit.spec)
          RELEASE=$(awk '$1 == "Release:" {print $2; exit}' qstit.spec | sed 's/%.*//')
          if [ "$RELEASE" = 1 ]; then TAG="v$VERSION"; else TAG="v$VERSION-$RELEASE"; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::notice::$TAG is already released. Bump Version or Release in qstit.spec to publish a new release."
          else
            echo "Publishing $TAG"
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.tag.outputs.name != ''
        uses: actions/download-artifact@v4
        with:
          path: rpms
          merge-multiple: true

      # Creates the tag on this commit when it does not exist yet. A tag made
      # with the workflow's own token does not start another run, so the
      # release is not published twice.
      - if: steps.tag.outputs.name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: rpms/**/*.rpm
